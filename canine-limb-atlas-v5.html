<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Canine Limb Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root {
  --bg: #edf1f0; --panel: #f8faf9; --ink: #14201f; --ink-2: #4a5b59; --line: #cbd6d4;
  --accent: #0a7a74; --accent-ink: #ffffff; --mark: #ffb62e; --mark-ink: #2b1d00;
  --good: #1d7a3e; --bad: #b3372b; --warn-bg: #fff3d6; --warn-ink: #5c4300;
  --stage-a: #fafcfb; --stage-b: #d3dedc; --org: #2f6bff; --ins: #e0245e;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --panel: #152221; --ink: #e6efed; --ink-2: #9db2af; --line: #2a3b39;
    --accent: #4fd1c5; --accent-ink: #06211f; --good: #5fd08a; --bad: #ff8a7a; --warn-bg: #3a2f10; --warn-ink: #ffdf9a;
    --stage-a: #1e302e; --stage-b: #0a1110; --org: #7aa2ff; --ins: #ff6b98; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --panel: #152221; --ink: #e6efed; --ink-2: #9db2af; --line: #2a3b39;
  --accent: #4fd1c5; --accent-ink: #06211f; --good: #5fd08a; --bad: #ff8a7a; --warn-bg: #3a2f10; --warn-ink: #ffdf9a;
  --stage-a: #1e302e; --stage-b: #0a1110; --org: #7aa2ff; --ins: #ff6b98; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.top h1 { margin: 0; font: 600 22px/1.2 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.top .sub { margin: 0; color: var(--ink-2); font: 400 12px/1.4 var(--mono); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.stage {
  position: relative; height: min(58svh, 520px); min-height: 320px; border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; background: radial-gradient(120% 90% at 50% 35%, var(--stage-a), var(--stage-b));
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage-chip {
  position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px);
  background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 4px 10px; font: 600 13px/1.3 var(--sans);
}
.stage-chip.q { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.stage-tools { position: absolute; top: 46px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
.stage-hint { position: absolute; left: 12px; right: 12px; bottom: 8px; margin: 0; pointer-events: none; color: var(--ink-2); font: 400 11px/1.4 var(--mono); }
.legend { position: absolute; right: 10px; bottom: 28px; display: flex; gap: 10px; align-items: center; font: 500 11px/1 var(--mono); color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .o i { background: var(--org); } .legend .n i { background: var(--ins); }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; min-height: 34px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn[aria-pressed="false"] { color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn:disabled { opacity: 0.5; cursor: default; }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 12px 10px 10px; background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel { padding: 16px; min-height: 0; overflow: auto; }
.label { margin: 0 0 4px; font: 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.mname { margin: 0 0 12px; font: 600 28px/1.15 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.draft { display: inline-block; margin: 0 0 12px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 3px 9px; font: 500 12px/1.4 var(--sans); }
.act { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
.stepnav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.stepnav.single { grid-template-columns: minmax(0, 1fr); }
.arrow { width: 40px; height: 40px; border-radius: 50%; padding: 0; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.stepcount { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.steplabel { display: block; font: 600 17px/1.3 var(--serif); text-wrap: balance; }
.stepnote { margin: 8px 0 0; color: var(--ink-2); font-size: 12.5px; max-width: 56ch; }
.playbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; font: 400 11px/1.2 var(--mono); color: var(--ink-2); }
.scrub input { flex: 1; min-width: 80px; accent-color: var(--accent); }
.facts { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 12px 14px; margin: 0; }
.facts dt { font: 500 11px/1.6 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding-top: 2px; }
.facts dd { margin: 0; font-size: 15px; line-height: 1.45; }
.empty h2 { margin: 0 0 6px; font: 600 22px/1.2 var(--serif); }
.empty p { margin: 0 0 16px; color: var(--ink-2); max-width: 46ch; }
.all { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.all summary { cursor: pointer; font-weight: 500; }
.mlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.mlist button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.mlist button:hover { border-color: var(--accent); }
.mlist button[aria-current="true"] { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); font-weight: 600; }
.note { margin: 18px 0 0; color: var(--ink-2); font-size: 12px; max-width: 60ch; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.seg .btn { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.seg .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.qmeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin: 0 0 10px; font: 400 11px/1.4 var(--mono); color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; }
.qtag { margin: 0 0 6px; color: var(--accent); font: 500 12px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.qstem { margin: 0 0 6px; font: 500 19px/1.4 var(--serif); text-wrap: pretty; }
.qsee { margin: 0 0 14px; color: var(--ink-2); font-size: 12.5px; }
.opts { display: grid; gap: 8px; margin-bottom: 14px; }
.opt { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .ltr { font: 500 12px/1.5 var(--mono); color: var(--ink-2); }
.opt .res { font: 500 11px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.opt.correct { border-color: var(--good); border-width: 2px; padding: 9px 11px; } .opt.correct .res { color: var(--good); }
.opt.wrong { border-color: var(--bad); border-width: 2px; padding: 9px 11px; } .opt.wrong .res { color: var(--bad); }
.fb { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin-bottom: 14px; }
.fb.ok { border-left-color: var(--good); } .fb.no { border-left-color: var(--bad); }
.fb strong { display: block; margin-bottom: 2px; } .fb p { margin: 0; max-width: 60ch; }
.qnav { display: flex; flex-wrap: wrap; gap: 8px; }
.done { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 14px; } .done p { margin: 0 0 10px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1.45fr) minmax(360px, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
  .stage { height: auto; min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <h1>Canine thoracic limb</h1>
  <p class="sub">Right limb &middot; schematic model &middot; eight muscles</p>
</header>

<main class="layout">
  <section class="stage" id="stage" aria-label="3D model of the canine thoracic limb">
    <div class="stage-chip" id="stageChip" hidden></div>
    <div class="stage-tools">
      <button class="btn" id="btnLat" type="button">Lateral</button>
      <button class="btn" id="btnMed" type="button">Medial</button>
      <button class="btn" id="btnBones" type="button" aria-pressed="true">Bones</button>
      <button class="btn" id="btnReset" type="button">Reset view</button>
    </div>
    <div class="legend" id="legend" hidden><span class="o"><i></i>Origin</span><span class="n"><i></i>Insertion</span></div>
    <p class="stage-hint" id="stageHint">Drag to rotate &middot; pinch or scroll to zoom &middot; tap a muscle</p>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist" aria-label="Study mode">
      <button class="tab" id="tabExplore" role="tab" aria-selected="true" aria-controls="explore" type="button">Explore</button>
      <button class="tab" id="tabQuiz" role="tab" aria-selected="false" aria-controls="quiz" type="button">Exam practice</button>
    </div>
    <div class="tabpanel" id="explore" role="tabpanel" aria-labelledby="tabExplore"></div>
    <div class="tabpanel" id="quiz" role="tabpanel" aria-labelledby="tabQuiz" hidden></div>
  </aside>
</main>

  if (model) model.boneMeshes.forEach(function (b) { b.visible = state.bones; });
});

// ---------- explore ----------
function selectMuscle(id) {
  state.selected = id && byId[id] ? id : null;
  state.step = 0;
  syncView();
  renderExplore();
  if (state.selected) {
    if (model) { var r = model.list.filter(function (x) { return x.id === state.selected; })[0]; if (r) turnTo(sideOf(r)); }
    playStep(state.selected, 0);
  } else { goNeutral(); }
}
function sideOf(r) {
  var a = r.plan.rest, s = 0; for (var i = 2; i < a.length; i += 3) s += a[i];
  return s >= 0 ? 1 : -1;
}
function listHtml(open) {
  return '<details class="all"' + (open ? ' open' : '') + '><summary>All eight muscles</summary><ul class="mlist">' +
    MUSCLES.map(function (m) {
      return '<li><button type="button" data-muscle="' + esc(m.id) + '"' + (m.id === state.selected ? ' aria-current="true"' : '') + '>' + esc(m.letter + '. ' + m.name) + '</button></li>';
    }).join('') + '</ul></details>';
}
function renderExplore() {
  var el = $('#explore'), m = state.selected ? byId[state.selected] : null, html;
  if (m) {
    var s = m.steps[state.step], many = m.steps.length > 1, note = '';
    if (s.hold) note = 'Stabilization is isometric: the muscle tightens to hold the joint steady, so the limb stays put and the muscle pulses.';
    else if (s.to && (s.to.ab || s.to.rot)) note = 'This movement happens out of the side-view plane. Rotate the model to see the limb from the front.';
    html = '<div class="detail"><p class="label">Selected muscle &middot; ' + esc(m.letter) + '</p><h2 class="mname">' + esc(m.name) + '</h2>' +
      (m.draft ? '<p class="draft">Draft entry: confirm these details against Miller’s Anatomy of the Dog before use.</p>' : '') +
      '<div class="act" role="group" aria-label="Actions of this muscle"><div class="stepnav' + (many ? '' : ' single') + '">' +
      (many ? '<button class="btn arrow" id="btnPrev" type="button" aria-label="Previous action">‹</button>' : '') +
      '<div><span class="stepcount">Action ' + (state.step + 1) + ' of ' + m.steps.length + '</span><span class="steplabel">' + esc(s.label) + '</span></div>' +
      (many ? '<button class="btn arrow" id="btnNext" type="button" aria-label="Next action">›</button>' : '') +
      '</div>' + (note ? '<p class="stepnote">' + esc(note) + '</p>' : '') +
      '<div class="playbar"><button class="btn primary" id="btnPlay" type="button">Replay</button>' +
      (s.hold ? '' : '<label class="scrub"><span>Start</span><input id="kRange" type="range" min="0" max="100" value="0" aria-label="Move the limb through this action"><span>End</span></label>') +
      '</div></div>' +
      '<dl class="facts"><dt>Action</dt><dd>' + esc(m.action) + '</dd><dt>Origin</dt><dd>' + esc(m.origin) + '</dd><dt>Insertion</dt><dd>' + esc(m.insertion) + '</dd><dt>Innervation</dt><dd>' + esc(m.innervation) + '</dd></dl></div>' +
      listHtml(false);
  } else {
    html = '<div class="empty"><p class="label">Nothing selected</p><h2>Tap a muscle on the limb</h2>' +
      '<p>The muscle lights up, the limb moves to show each of its actions, and its name, attachments and innervation appear here. You can also pick one from the list.</p></div>' + listHtml(true);
  }
  html += '<p class="note">Muscle shapes are schematic and are placed from the attachment points. Text follows the course notes for this model.</p>';
  el.innerHTML = html;
  var range = $('#kRange');
  if (range) {
    range.addEventListener('pointerdown', function () { dragging = true; });
    range.addEventListener('pointerup', function () { dragging = false; });
    range.addEventListener('input', function () {
      var st = curStep(); if (!st) return;
      anim = null; pulseK = 0;
      pose = lerpPose(fullPose(st.from), fullPose(st.to), range.value / 100);
      applyPose();
    });
  }
}
function stepTo(i) {
  var m = state.selected && byId[state.selected]; if (!m) return;
  state.step = (i + m.steps.length) % m.steps.length;
  renderExplore(); playStep(state.selected, state.step);
}
$('#explore').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-muscle]');
  if (b) { selectMuscle(b.getAttribute('data-muscle')); return; }
  var t = ev.target.closest('button'); if (!t) return;
  if (t.id === 'btnNext') stepTo(state.step + 1);
  else if (t.id === 'btnPrev') stepTo(state.step - 1);
  else if (t.id === 'btnPlay') playStep(state.selected, state.step);
});

// ---------- tabs ----------
function showTab(name) {
  var quiz = name === 'quiz';
  state.mode = quiz ? 'quiz' : 'explore';
  $('#tabExplore').setAttribute('aria-selected', String(!quiz));
  $('#tabQuiz').setAttribute('aria-selected', String(quiz));
  $('#explore').hidden = quiz; $('#quiz').hidden = !quiz;
  if (quiz) { qs.shownId = null; renderQuiz(); }
  else { syncView(); if (state.selected) playStep(state.selected, state.step); else goNeutral(); }
}
$('#tabExplore').addEventListener('click', function () { showTab('explore'); });
$('#tabQuiz').addEventListener('click', function () { showTab('quiz'); });

// ---------- exam practice ----------
var ORDER_LABEL = { 1: 'First order · identify the muscle', 2: 'Second order · actions and nerves', 3: 'Third order · shared attachments' };
var LETTERS = ['A', 'B', 'C', 'D', 'E'];
var QUIZ = buildQuiz(Math.random);
var qs = { filter: 'all', idx: 0, answers: {}, shownId: null };
function qList() { return QUIZ.filter(function (q) { return qs.filter === 'all' || q.order === Number(qs.filter); }); }
function currentQuestion() { var l = qList(); return l[Math.max(0, Math.min(qs.idx, l.length - 1))]; }
function tally(list) {
  var done = 0, right = 0;
  list.forEach(function (q) { if (qs.answers[q.id] !== undefined) { done++; if (qs.answers[q.id] === q.answer) right++; } });
  return { done: done, right: right };
}
function renderQuiz() {
  var el = $('#quiz'), list = qList();
  if (qs.idx >= list.length) qs.idx = list.length - 1;
  if (qs.idx < 0) qs.idx = 0;
  var q = list[qs.idx], t = tally(list);
  var filters = [['all', 'All ' + QUIZ.length], ['1', 'First order'], ['2', 'Second order'], ['3', 'Third order']];
  var html = '<div class="seg" role="group" aria-label="Question order">' + filters.map(function (f) {
    return '<button class="btn" type="button" data-filter="' + f[0] + '" aria-pressed="' + (qs.filter === f[0]) + '">' + f[1] + '</button>';
  }).join('') + '</div>';
  if (!q) { el.innerHTML = html + '<p>No questions in this set.</p>'; return; }
  var answered = qs.answers[q.id], has = answered !== undefined;
  html += '<p class="qmeta"><span>Question ' + (qs.idx + 1) + ' of ' + list.length + '</span><span>' + t.right + ' of ' + t.done + ' correct</span></p>' +
    '<p class="qtag">' + esc(ORDER_LABEL[q.order] || '') + '</p>' +
    '<h2 class="qstem">' + esc(q.stem) + '</h2><p class="qsee">Look at the highlighted muscle on the model.</p><div class="opts">' +
    q.options.map(function (o, i) {
      var cls = 'opt', res = '';
      if (has && i === q.answer) { cls += ' correct'; res = 'Correct answer'; }
      else if (has && i === answered) { cls += ' wrong'; res = 'Your answer'; }
      return '<button class="' + cls + '" type="button" data-opt="' + i + '"' + (has ? ' disabled' : '') + '><span class="ltr">' + LETTERS[i] + '</span><span>' + esc(o) + '</span><span class="res">' + res + '</span></button>';
    }).join('') + '</div>';
  if (has) {
    var ok = answered === q.answer;
    html += '<div class="fb ' + (ok ? 'ok' : 'no') + '" role="status"><strong>' + (ok ? 'Correct' : 'Not quite') + '</strong><p>' + esc(q.explanation) + '</p>' +
      (q.draft ? '<p class="note" style="margin-top:6px">Draft content: confirm against Miller’s Anatomy of the Dog.</p>' : '') + '</div>';
  }
  html += '<div class="qnav"><button class="btn" type="button" id="qPrev"' + (qs.idx === 0 ? ' disabled' : '') + '>Previous</button>';
  if (has && q.step !== undefined) html += '<button class="btn" type="button" id="qShow">Show movement</button>';
  html += '<button class="btn primary" type="button" id="qNext"' + (qs.idx >= list.length - 1 ? ' disabled' : '') + '>Next question</button></div>';
  if (t.done === list.length) html += '<div class="done"><p><strong>Set complete: ' + t.right + ' of ' + list.length + ' correct.</strong></p><button class="btn" type="button" id="qRetry">Try this set again</button></div>';
  el.innerHTML = html;
  if (qs.shownId !== q.id) { qs.shownId = q.id; goNeutral(); }
  syncView();
}
$('#quiz').addEventListener('click', function (ev) {
  var f = ev.target.closest('[data-filter]');
  if (f) { qs.filter = f.getAttribute('data-filter'); qs.idx = 0; renderQuiz(); return; }
  var list = qList(), q = list[qs.idx], o = ev.target.closest('[data-opt]');
  if (o && q && qs.answers[q.id] === undefined) {
    qs.answers[q.id] = Number(o.getAttribute('data-opt'));
    renderQuiz();
    if (q.step !== undefined) playStep(q.muscle, q.step);
    return;
  }
  var id = (ev.target.closest('button') || {}).id;
  if (id === 'qNext') { qs.idx++; renderQuiz(); }
  else if (id === 'qPrev') { qs.idx--; renderQuiz(); }
  else if (id === 'qShow' && q) { playStep(q.muscle, q.step); stageEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' }); }
  else if (id === 'qRetry') { list.forEach(function (x) { delete qs.answers[x.id]; }); qs.idx = 0; qs.shownId = null; renderQuiz(); }
});

// ---------- start ----------
renderExplore();
renderQuiz();
(function boot() {
  if (typeof THREE === 'undefined' || !THREE.GLTFLoader || !THREE.OrbitControls) {
    showNoGL('The 3D graphics library did not load (THREE=' + (typeof THREE) + ', loader=' + !!(typeof THREE !== 'undefined' && THREE.GLTFLoader) + ', controls=' + !!(typeof THREE !== 'undefined' && THREE.OrbitControls) + '). The muscle list and exam questions still work.');
    return;
  }
  showNoGL('Loading the 3D model\u2026');
  try { initStage(); } catch (err) {
    renderer = null;
    showNoGL('The 3D view could not start (WebGL).' + why(err) + ' The muscle list and exam questions still work.');
    return;
  }
  try { loadModel(); } catch (err) { showNoGL('The 3D model could not be loaded.' + why(err)); }
})();
// Without a render loop (no WebGL) there is nothing to animate; selection still updates the text.
})();
</script>
